name: Selenium Automation Tests


on:

  repository_dispatch:

    types:

      - run-tests



permissions:

  contents: read

  pages: write

  id-token: write



jobs:



  selenium-test:


    runs-on: ubuntu-latest



    steps:


      # Checkout Selenium automation repository

      - name: Checkout Automation Code

        uses: actions/checkout@v4



      # Checkout React application repository

      - name: Checkout Application Code

        uses: actions/checkout@v4

        with:

          repository: ankushsfit/demo-application-repo

          path: application



      # Setup Java

      - name: Setup Java

        uses: actions/setup-java@v4

        with:

          java-version: '17'

          distribution: 'temurin'

          cache: maven



      # Setup Node

      - name: Setup Node

        uses: actions/setup-node@v4

        with:

          node-version: '20'

          cache: npm

          cache-dependency-path: application/frontend/package-lock.json



      # Install React dependencies

      - name: Install Frontend Dependencies

        working-directory: application/frontend

        run: npm install



      # Start React Application

      - name: Start React Application

        working-directory: application/frontend

        run: |

          npm run dev -- --host 0.0.0.0 &

          sleep 10

          curl http://localhost:5173



      # Setup Chrome

      - name: Setup Chrome

        uses: browser-actions/setup-chrome@v1



      # Verify Environment

      - name: Verify Environment

        run: |

          java -version

          google-chrome --version

          mvn -version



      # Debug Source Files

      - name: Debug Source Files

        run: |

          echo "===== BaseTest.java ====="

          sed -n '1,100p' src/test/java/base/BaseTest.java


          echo "===== DriverFactory.java ====="

          sed -n '1,150p' src/main/java/drivers/DriverFactory.java


          echo "===== Find BaseTest Files ====="

          find . -name "BaseTest.java" -o -name "BaseTest.class"
          find . \( -name "BaseTest.java" -o -name "BaseTest.class" -o -name "DriverFactory.java" -o -name "DriverFactory.class" \)



      - name: Clean compiled files
        run: |
           rm -rf target
           
      - name: Search quitDriver reference
        run: |
          grep -R "quitDriver" . || true
      
      
      - name: Show Maven test classes
        run: |
          find . -type f -name "*.class" || true

      # Run Selenium Tests

      - name: Run Selenium Tests

        run: mvn clean test

        continue-on-error: true



      # Install Allure CLI

      - name: Install Allure

        if: always()

        run: |

          sudo apt-get update

          sudo apt-get install -y wget unzip


          wget https://github.com/allure-framework/allure2/releases/download/2.27.0/allure-2.27.0.zip


          unzip allure-2.27.0.zip


          sudo mv allure-2.27.0 /opt/allure


          sudo ln -s /opt/allure/bin/allure /usr/bin/allure



      # Check Allure Results

      - name: Check Allure Results

        if: always()

        run: |

          ls -la

          ls -la allure-results || true



      # Generate Allure HTML Report

      - name: Generate Allure Report

        if: always()

        run: |

          allure generate allure-results \
          --clean \
          -o allure-report



      # Upload Allure HTML Report Artifact

      - name: Upload Allure HTML Report

        if: always()

        uses: actions/upload-artifact@v4

        with:

          name: allure-html-report

          path: allure-report



      # Upload Raw Allure Results

      - name: Upload Allure Results

        if: always()

        uses: actions/upload-artifact@v4

        with:

          name: allure-results

          path: allure-results



      # Upload Screenshots

      - name: Upload Screenshots

        if: always()

        uses: actions/upload-artifact@v4

        with:

          name: selenium-screenshots

          path: screenshots



      # Prepare GitHub Pages Deployment

      - name: Upload Pages Artifact

        if: always()

        uses: actions/upload-pages-artifact@v3

        with:

          path: allure-report





  # Deploy Allure Report

  deploy-report:


    needs: selenium-test


    runs-on: ubuntu-latest



    environment:


      name: github-pages


      url: ${{ steps.deployment.outputs.page_url }}



    steps:


      - name: Deploy Allure Report To GitHub Pages

        id: deployment

        uses: actions/deploy-pages@v4
