name: Selenium Automation Tests

on:
  repository_dispatch:
    types:
      - run-tests

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  selenium-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Automation Code
        uses: actions/checkout@v4

      - name: Checkout Application Code
        uses: actions/checkout@v4
        with:
          repository: ankushsfit/demo-application-repo
          path: application

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: application/frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: application/frontend
        run: npm ci

      - name: Start React Application
        working-directory: application/frontend
        run: |
          npm run dev -- --host 0.0.0.0 > app.log 2>&1 &
          echo "Waiting for application..."
          for i in {1..30}; do
            if curl -fs http://localhost:5173 >/dev/null; then
              echo "Application is up"
              exit 0
            fi
            sleep 2
          done
          echo "Application failed to start"
          cat app.log
          exit 1

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Verify Environment
        run: |
          java -version
          mvn -version
          google-chrome --version

      - name: Clean Previous Reports
        run: |
          rm -rf allure-results
          rm -rf allure-report
          mkdir -p allure-results

      - name: Run Selenium Tests
        run: |
          mvn clean test

      - name: Verify Allure Results
        if: always()
        run: |
          echo "===== Allure Files ====="
          find allure-results -type f | sort

          RESULT_COUNT=$(find allure-results -name "*-result.json" | wc -l)
          CONTAINER_COUNT=$(find allure-results -name "*-container.json" | wc -l)

          echo "Result Files : $RESULT_COUNT"
          echo "Container Files : $CONTAINER_COUNT"

          if [ "$RESULT_COUNT" -eq 0 ]; then
            echo "No Allure result files found."
            exit 1
          fi

      - name: Install Allure CLI
        if: always()
        run: |
          ALLURE_VERSION=2.29.1
          wget -q https://github.com/allure-framework/allure2/releases/download/${ALLURE_VERSION}/allure-${ALLURE_VERSION}.tgz
          tar -xzf allure-${ALLURE_VERSION}.tgz
          sudo mv allure-${ALLURE_VERSION} /opt/allure
          sudo ln -sf /opt/allure/bin/allure /usr/local/bin/allure
          allure --version

      - name: Generate Allure Report
        if: always()
        run: |
          allure generate allure-results \
            --clean \
            --single-file \
            -o allure-report

      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report

      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results

      - name: Upload Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots
          if-no-files-found: ignore

      - name: Upload Pages Artifact
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report

  deploy-report:
    needs: selenium-test
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy Report
        id: deployment
        uses: actions/deploy-pages@v4
